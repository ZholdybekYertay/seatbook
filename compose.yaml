name: seatbook
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: seatbook
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env first}
      POSTGRES_DB: seatbook
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - seatbook-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatbook -d seatbook"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://seatbook:${DB_PASSWORD:?Set DB_PASSWORD}@db:5432/seatbook?sslmode=disable"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      APP_ORIGIN: "http://localhost:${APP_PORT:-8080}"
      COOKIE_SECURE: "false"
      HOLD_SECONDS: ${HOLD_SECONDS:-300}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
volumes:
  seatbook-data:
