name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: seatbook_test
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: seatbook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seatbook_test -d seatbook_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://seatbook_test:test_only_password@localhost:5432/seatbook_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - run: go test -race -count=1 ./...
      - run: go vet ./...
      - run: go build ./cmd/api
